[package]
name = "alyson"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0.21"
sqlx = { version = "0.8", features = [ "sqlite", "runtime-tokio", "macros", "migrate" ] }
libc = "0.2"
hdrhistogram = "7.5"
sysinfo = "0.33"
